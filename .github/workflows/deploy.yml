name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Secrets が登録されていれば config.js をそこから作る。
      # 未登録ならリポジトリに入っている config.js をそのまま使う。
      - name: Supabase の接続先を書き込む
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            node -e '
              const fs = require("fs");
              const body = "window.HENGAO_CONFIG = " + JSON.stringify({
                supabaseUrl: process.env.SUPABASE_URL,
                supabaseAnonKey: process.env.SUPABASE_ANON_KEY,
              }, null, 2) + ";\n";
              fs.writeFileSync("public/config.js", body);
            '
            echo "Secrets から config.js を生成しました"
          else
            echo "Secrets が未設定のため、リポジトリの public/config.js を使います"
          fi

      # カスタムドメインを使う場合は、リポジトリの Variables に
      # CUSTOM_DOMAIN（例: xn--ursw68l.com）を登録してください。
      - name: CNAME を置く
        if: vars.CUSTOM_DOMAIN != ''
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > public/CNAME

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
